<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>You're offline — NeighbourNet</title>
  <link rel="icon" href="/neighbournet/assets/images/icon-192.png">
  <link rel="stylesheet" href="/neighbournet/assets/css/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:#f4f7fb;font-family:system-ui,sans-serif}
    main{max-width:34rem;background:#fff;padding:2rem;border-radius:1.25rem;box-shadow:0 12px 40px #17255418;text-align:center}
    .offline-icon{width:4rem;height:4rem;margin:0 auto 1rem;border-radius:1rem;background:#eaf1ff;display:grid;place-items:center;font-size:2rem}
    a{display:inline-block;margin-top:1rem;padding:.75rem 1.1rem;border-radius:.65rem;background:#2563eb;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="offline-icon" aria-hidden="true">⌁</div>
    <h1>You're currently offline</h1>
    <p>NeighbourNet couldn't reach the server. Public pages and private information are not stored for offline viewing.</p>
    <p><strong>Important:</strong> Any incident report that has not received server confirmation is not submitted. Return online and submit it again.</p>
    <a href="/neighbournet/">Try again</a>
  </main>
</body>
</html>
